name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 三平台都跑测试：项目把 Windows 当一等公民（junction / shim / PATH 广播 / BOM 处理
  # 都有平台分支），且 shell 脚本测试会在各平台真实存在的 shell 里执行生成的脚本
  # （Linux: bash/sh，macOS: bash/sh/zsh，Windows: Git Bash/PowerShell/cmd）。
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install fish & zsh (shell script tests)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        continue-on-error: true
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends fish zsh

      - name: Vet
        run: go vet ./internal/... .

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test
        env:
          VSM_TEST_PYTHON: python
        run: go test ./internal/... .

      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./internal/... .

  project-docker:
    name: isolated project (real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run independent projects in real containers
        shell: bash
        run: |
          set -euo pipefail
          go build -o dist/vsm .
          vsm="$PWD/dist/vsm"
          work="$(mktemp -d)"
          mkdir -p "$work/a" "$work/b"
          docker pull busybox:1.37.0
          for project in a b; do
            (
              cd "$work/$project"
              "$vsm" project init --mode docker --image busybox:1.37.0
              "$vsm" run -- sh -c 'printf isolated > proof.txt; test ! -e /workspace/../b/proof.txt'
            )
            test "$(cat "$work/$project/proof.txt")" = isolated
          done
          (
            cd "$work/a"
            printf 'go 1.25.11\n' > .tool-versions
            if "$vsm" run -- sh -c 'touch should-not-run'; then
              echo 'An image without the required language was accepted' >&2
              exit 1
            fi
            test ! -e should-not-run
          )

  build-cli:
    name: build CLI (zero-CGO cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # CLI 无第三方依赖，可零 CGO 一键交叉编译全平台
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o dist/vsm-$os-$arch .
          done
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/vsm-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/vsm-windows-arm64.exe .

  # GUI 必须各平台本地编译（Windows 免 CGO；macOS / Linux 依赖系统 WebView + CGO）。
  # 不加 continue-on-error：此前 Release 里 macOS GUI 连续编译失败，却因
  # continue-on-error 被显示为「成功」，v1.0.0 因此静默缺了 macOS 安装包。
  build-gui:
    name: build GUI (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos
          - os: ubuntu-22.04
            label: linux
          - os: windows-latest
            label: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux WebKit deps
        if: matrix.label == 'linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Test GUI backend
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.label == 'windows' && '0' || '1' }}
        run: go test -tags production ./gui

      - name: Build GUI (windows, no CGO)
        if: matrix.label == 'windows'
        run: go build -tags production -ldflags "-H windowsgui -s -w" -o vsm-gui.exe ./gui

      # 与 Release 共用同一脚本：通用二进制 + .app + 图标 + 签名 + 冒烟测试全流程
      - name: Test macOS process watchdog
        if: matrix.label == 'macos'
        run: python3 -m unittest discover -s scripts -p test_smoke_macos.py

      - name: Package macOS app (universal)
        if: matrix.label == 'macos'
        run: bash scripts/package-macos.sh "0.0.0-ci.${{ github.run_number }}" dist

      - name: Upload macOS app
        if: matrix.label == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: vsm-gui-macos-universal
          path: dist/vsm-gui-macos-universal.zip
          retention-days: 14

      # 直接管理解压后的应用进程，不通过 AppleScript 请求自动化权限。
      # 启动、截图和退出均有超时；即使启动失败，已构建的 app 仍可下载排查。
      - name: Smoke-launch macOS app
        if: matrix.label == 'macos'
        timeout-minutes: 2
        run: python3 scripts/smoke-macos.py dist/vsm-gui-macos-universal.zip dist/macos-screenshot.png

      - name: Upload macOS screenshot
        if: always() && matrix.label == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-screenshot
          path: dist/macos-screenshot.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build GUI (linux)
        if: matrix.label == 'linux'
        env:
          CGO_ENABLED: "1"
        run: go build -tags production -ldflags "-s -w" -o vsm-gui ./gui
