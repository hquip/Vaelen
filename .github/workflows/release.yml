name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# 同一 ref 的新发布会取消仍在跑的旧 run（避免卡死的 run 阻塞队列或重复发布）。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# 每个平台在各自的 runner 上本地编译：CLI 是纯 Go 零 CGO（可顺带交叉编 arm64），
# GUI 是 Wails（Windows 用 go-webview2 免 CGO；macOS/Linux 需 CGO + 系统 WebView，
# 无法在 Windows 上交叉编译，故必须分平台 runner 本地构建）。
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-14
            label: macos
          - os: ubuntu-22.04
            label: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # 版本号统一取自 tag（v1.2.3 → 1.2.3），注入到 `vsm version` 与 macOS Info.plist
      VSM_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Linux GUI 依赖 GTK3 + WebKit2GTK（Wails v2 默认 4.0）。
      # apt 偶发卡死时最多等 8 分钟即跳过，不阻塞 CLI 发布。
      - name: Install Linux GUI deps
        if: matrix.label == 'linux'
        timeout-minutes: 8
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      # ---------- CLI（零 CGO，交叉编译该 OS 家族的 amd64/arm64）----------
      - name: Build CLI
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${VSM_VERSION#v}"
          LDFLAGS="-s -w -X vsm/internal/cli.version=${VERSION}"
          mkdir -p dist
          case "${{ matrix.label }}" in
            windows) targets="windows/amd64 windows/arm64" ;;
            macos)   targets="darwin/amd64 darwin/arm64" ;;
            linux)   targets="linux/amd64 linux/arm64" ;;
          esac
          for t in $targets; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$LDFLAGS" -o "dist/vsm-$os-$arch$ext" .
          done
          ls -lh dist

      # ---------- GUI（各平台本地构建）----------
      # GUI 失败不阻断 CLI 发布（continue-on-error），但末尾的 verify 步骤会让整个 run
      # 显示失败并列出缺失的安装包——v1.0.0 正是因为没有这一步，才静默缺了 macOS GUI。
      - name: Build GUI (Windows)
        if: matrix.label == 'windows'
        continue-on-error: true
        shell: bash
        run: |
          for i in 1 2 3; do
            go build -tags production -ldflags "-H windowsgui -s -w" -o dist/vsm-gui-windows-amd64.exe ./gui && exit 0
            echo "GUI build attempt $i failed; cleaning cache and retrying..."
            go clean -cache
            sleep 5
          done
          exit 1

      # 与 CI 共用同一脚本：arm64 + amd64 通用二进制、内置 CLI、.icns 图标、
      # Info.plist、ad-hoc 签名与冒烟测试
      - name: Build GUI (macOS, universal .app)
        if: matrix.label == 'macos'
        continue-on-error: true
        run: bash scripts/package-macos.sh "${VSM_VERSION#v}" dist

      - name: Build GUI (Linux)
        if: matrix.label == 'linux'
        continue-on-error: true
        env:
          CGO_ENABLED: "1"
        run: |
          for i in 1 2 3; do
            go build -tags production -ldflags "-s -w" -o dist/vsm-gui-linux-amd64 ./gui && exit 0
            echo "GUI build attempt $i failed; cleaning cache and retrying..."
            go clean -cache
            sleep 5
          done
          exit 1

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # 汇总三平台产物，统一发布到 GitHub Release。
  # if: always() 确保即便某个 build job 异常，也用已成功上传的产物照常发布。
  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 发布后再检查：缺任何一个 GUI 安装包都让 run 失败并在摘要里点名，
      # 而不是像以前那样显示一片绿色。
      - name: Verify expected assets
        run: |
          missing=0
          for f in vsm-gui-windows-amd64.exe vsm-gui-macos-universal.zip vsm-gui-linux-amd64; do
            if [ -f "dist/$f" ]; then
              echo "✓ $f"
            else
              echo "::error title=Release 缺少安装包::$f 未生成，请查看对应平台的 Build GUI 步骤日志"
              echo "- ❌ 缺少 \`$f\`" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            fi
          done
          exit $missing
